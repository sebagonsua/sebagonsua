<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0814"/>
      <stop offset="50%" stop-color="#120e24"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
    <filter id="blurBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fondo -->
  <rect width="1000" height="280" rx="20" fill="url(#bg)"/>

  <!-- blobs difuminados detras del vidrio -->
  <circle cx="120" cy="30" r="130" fill="#8B5CF6" opacity="0.55" filter="url(#blurBig)"/>
  <circle cx="900" cy="260" r="150" fill="#6D28D9" opacity="0.5" filter="url(#blurBig)"/>
  <circle cx="560" cy="0" r="90" fill="#A78BFA" opacity="0.35" filter="url(#blurBig)"/>
  <circle cx="330" cy="280" r="100" fill="#7C3AED" opacity="0.35" filter="url(#blurBig)"/>
  <circle cx="760" cy="60" r="60" fill="#C4B5FD" opacity="0.2" filter="url(#blurSoft)"/>

  <!-- panel de vidrio principal -->
  <rect x="90" y="55" width="820" height="170" rx="24"
        fill="url(#glassFill)"
        stroke="url(#glassStroke)" stroke-width="1.6"/>

  <!-- reflejo superior del panel -->
  <rect x="93" y="58" width="814" height="70" rx="21" fill="#ffffff" fill-opacity="0.05"/>
  <!-- linea de brillo que cruza -->
  <rect x="140" y="57" width="380" height="1.5" fill="url(#shine)"/>

  <!-- texto -->
  <text x="500" y="130" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="600" fill="#f4f4f5" letter-spacing="1">
    Sebastián González Suárez
  </text>
  <text x="500" y="172" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="500" fill="#b6a8e8" letter-spacing="4">
    SOFTWARE DEVELOPER · IT SUPPORT · TESTER
  </text>

  <!-- linea de acento con degrade -->
  <rect x="400" y="192" width="200" height="2" rx="1" fill="url(#accent)"/>
</svg>
